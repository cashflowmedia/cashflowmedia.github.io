<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Inter:wght@800;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#0c0e0d;font-family:Inter,sans-serif;color:#fff}
  body{width:1600px;display:grid;grid-template-columns:1fr 1fr;gap:0;padding:48px 0}
  .opt{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:40px;gap:8px}
  .opt h3{font-size:18px;font-weight:600;color:#9aa;margin:0 0 12px;letter-spacing:.06em;text-transform:uppercase}
  .badge{display:inline-block;background:#1a1f1d;color:#1aff66;padding:4px 10px;border-radius:8px;font-size:13px;font-weight:600;margin-bottom:18px;border:1px solid #2a3530}
  .icon{width:300px;height:300px}
</style></head><body>

<!-- ========== OPTION A · Dark inlaid CFM in each bar, no $ ========== -->
<div class="opt">
  <h3>Option A · CFM in bars, no $</h3>
  <span class="badge">cleanest, lets the bars + letters carry the brand</span>
  <svg class="icon" viewBox="0 0 64 64" fill="none">
    <defs>
      <linearGradient id="b1A" x1="0" y1="60" x2="0" y2="36" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#006622"/><stop offset="1" stop-color="#1aff66"/></linearGradient>
      <linearGradient id="b2A" x1="0" y1="60" x2="0" y2="22" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#008833"/><stop offset=".6" stop-color="#1aff66"/><stop offset="1" stop-color="#aaff99"/></linearGradient>
      <linearGradient id="b3A" x1="0" y1="60" x2="0" y2="6"  gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#008833"/><stop offset=".45" stop-color="#1aff66"/><stop offset=".78" stop-color="#aaff99"/><stop offset="1" stop-color="#F4C95C"/></linearGradient>
      <filter id="gA" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <g filter="url(#gA)">
      <path d="M8 56 V46 L19 38 V56 Z" fill="url(#b1A)" opacity=".85"/>
      <path d="M8 46 L19 38 L19 40 L8 47.5 Z" fill="rgba(255,255,255,.55)"/>
      <path d="M19 38 V56 L17.3 56 V39 Z" fill="rgba(0,0,0,.4)"/>
      <path d="M22 56 V34 L33 24 V56 Z" fill="url(#b2A)" opacity=".95"/>
      <path d="M22 34 L33 24 L33 26 L22 35.5 Z" fill="rgba(255,255,255,.55)"/>
      <path d="M33 24 V56 L31.3 56 V25 Z" fill="rgba(0,0,0,.4)"/>
      <path d="M36 56 V20 L47 8 V56 Z" fill="url(#b3A)"/>
      <path d="M36 20 L47 8 L47 10 L36 21.5 Z" fill="rgba(255,255,255,.6)"/>
      <path d="M47 8 V56 L45.3 56 V9 Z" fill="rgba(0,0,0,.4)"/>
    </g>
    <text x="13.5" y="52" text-anchor="middle" font-family="Bowlby One, Inter, sans-serif" font-weight="900" font-size="9" fill="#001a0e" style="letter-spacing:-0.5px">C</text>
    <text x="27.5" y="44" text-anchor="middle" font-family="Bowlby One, Inter, sans-serif" font-weight="900" font-size="9" fill="#001a0e" style="letter-spacing:-0.5px">F</text>
    <text x="41.5" y="36" text-anchor="middle" font-family="Bowlby One, Inter, sans-serif" font-weight="900" font-size="9" fill="#001a0e" style="letter-spacing:-0.5px">M</text>
  </svg>
</div>

<!-- ========== OPTION B · CFM in bars + $ floating above tall bar ========== -->
<div class="opt">
  <h3>Option B · CFM in bars + small $ above</h3>
  <span class="badge">keeps the $ accent up top</span>
  <svg class="icon" viewBox="0 0 64 64" fill="none" overflow="visible">
    <defs>
      <linearGradient id="b1B" x1="0" y1="60" x2="0" y2="36" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#006622"/><stop offset="1" stop-color="#1aff66"/></linearGradient>
      <linearGradient id="b2B" x1="0" y1="60" x2="0" y2="22" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#008833"/><stop offset=".6" stop-color="#1aff66"/><stop offset="1" stop-color="#aaff99"/></linearGradient>
      <linearGradient id="b3B" x1="0" y1="60" x2="0" y2="6"  gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#008833"/><stop offset=".45" stop-color="#1aff66"/><stop offset=".78" stop-color="#aaff99"/><stop offset="1" stop-color="#F4C95C"/></linearGradient>
      <filter id="gB" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <g filter="url(#gB)">
      <path d="M8 56 V46 L19 38 V56 Z" fill="url(#b1B)" opacity=".85"/>
      <path d="M8 46 L19 38 L19 40 L8 47.5 Z" fill="rgba(255,255,255,.55)"/>
      <path d="M19 38 V56 L17.3 56 V39 Z" fill="rgba(0,0,0,.4)"/>
      <path d="M22 56 V34 L33 24 V56 Z" fill="url(#b2B)" opacity=".95"/>
      <path d="M22 34 L33 24 L33 26 L22 35.5 Z" fill="rgba(255,255,255,.55)"/>
      <path d="M33 24 V56 L31.3 56 V25 Z" fill="rgba(0,0,0,.4)"/>
      <path d="M36 56 V20 L47 8 V56 Z" fill="url(#b3B)"/>
      <path d="M36 20 L47 8 L47 10 L36 21.5 Z" fill="rgba(255,255,255,.6)"/>
      <path d="M47 8 V56 L45.3 56 V9 Z" fill="rgba(0,0,0,.4)"/>
    </g>
    <text x="13.5" y="52" text-anchor="middle" font-family="Bowlby One, Inter, sans-serif" font-weight="900" font-size="9" fill="#001a0e" style="letter-spacing:-0.5px">C</text>
    <text x="27.5" y="44" text-anchor="middle" font-family="Bowlby One, Inter, sans-serif" font-weight="900" font-size="9" fill="#001a0e" style="letter-spacing:-0.5px">F</text>
    <text x="41.5" y="36" text-anchor="middle" font-family="Bowlby One, Inter, sans-serif" font-weight="900" font-size="9" fill="#001a0e" style="letter-spacing:-0.5px">M</text>
    <text x="42" y="6" text-anchor="middle" font-family="Bowlby One, Inter, sans-serif" font-weight="900" font-size="8" fill="#F4C95C" filter="drop-shadow(0 0 1.5px #F4C95C)">$</text>
  </svg>
</div>

<!-- ========== OPTION C · Cream/gold letters at TOP of each bar (accent style) ========== -->
<div class="opt">
  <h3>Option C · Gold tops of bars</h3>
  <span class="badge">CFM as a cream highlight at the bar tops</span>
  <svg class="icon" viewBox="0 0 64 64" fill="none">
    <defs>
      <linearGradient id="b1C" x1="0" y1="60" x2="0" y2="36" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#006622"/><stop offset="1" stop-color="#1aff66"/></linearGradient>
      <linearGradient id="b2C" x1="0" y1="60" x2="0" y2="22" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#008833"/><stop offset=".6" stop-color="#1aff66"/><stop offset="1" stop-color="#aaff99"/></linearGradient>
      <linearGradient id="b3C" x1="0" y1="60" x2="0" y2="6"  gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#008833"/><stop offset=".45" stop-color="#1aff66"/><stop offset=".78" stop-color="#aaff99"/><stop offset="1" stop-color="#F4C95C"/></linearGradient>
      <filter id="gC" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <g filter="url(#gC)">
      <path d="M8 56 V46 L19 38 V56 Z" fill="url(#b1C)" opacity=".85"/>
      <path d="M8 46 L19 38 L19 40 L8 47.5 Z" fill="rgba(255,255,255,.55)"/>
      <path d="M19 38 V56 L17.3 56 V39 Z" fill="rgba(0,0,0,.4)"/>
      <path d="M22 56 V34 L33 24 V56 Z" fill="url(#b2C)" opacity=".95"/>
      <path d="M22 34 L33 24 L33 26 L22 35.5 Z" fill="rgba(255,255,255,.55)"/>
      <path d="M33 24 V56 L31.3 56 V25 Z" fill="rgba(0,0,0,.4)"/>
      <path d="M36 56 V20 L47 8 V56 Z" fill="url(#b3C)"/>
      <path d="M36 20 L47 8 L47 10 L36 21.5 Z" fill="rgba(255,255,255,.6)"/>
      <path d="M47 8 V56 L45.3 56 V9 Z" fill="rgba(0,0,0,.4)"/>
    </g>
    <text x="13.5" y="46" text-anchor="middle" font-family="Bowlby One, Inter, sans-serif" font-weight="900" font-size="6" fill="#FFE4A0" filter="drop-shadow(0 0 0.8px #F4C95C)">C</text>
    <text x="27.5" y="32" text-anchor="middle" font-family="Bowlby One, Inter, sans-serif" font-weight="900" font-size="6" fill="#FFE4A0" filter="drop-shadow(0 0 0.8px #F4C95C)">F</text>
    <text x="41.5" y="17" text-anchor="middle" font-family="Bowlby One, Inter, sans-serif" font-weight="900" font-size="6" fill="#001a0e">M</text>
    <text x="41.5" y="44" text-anchor="middle" font-family="Bowlby One, Inter, sans-serif" font-weight="900" font-size="22" fill="#001a0e" style="letter-spacing:-1px">$</text>
  </svg>
</div>

<!-- ========== OPTION D · Bigger CFM, no $, letters fill bars top to bottom ========== -->
<div class="opt">
  <h3>Option D · Big CFM filling bars</h3>
  <span class="badge">letters as tall as each bar allows</span>
  <svg class="icon" viewBox="0 0 64 64" fill="none">
    <defs>
      <linearGradient id="b1D" x1="0" y1="60" x2="0" y2="36" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#006622"/><stop offset="1" stop-color="#1aff66"/></linearGradient>
      <linearGradient id="b2D" x1="0" y1="60" x2="0" y2="22" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#008833"/><stop offset=".6" stop-color="#1aff66"/><stop offset="1" stop-color="#aaff99"/></linearGradient>
      <linearGradient id="b3D" x1="0" y1="60" x2="0" y2="6"  gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#008833"/><stop offset=".45" stop-color="#1aff66"/><stop offset=".78" stop-color="#aaff99"/><stop offset="1" stop-color="#F4C95C"/></linearGradient>
      <filter id="gD" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <g filter="url(#gD)">
      <path d="M8 56 V46 L19 38 V56 Z" fill="url(#b1D)" opacity=".85"/>
      <path d="M8 46 L19 38 L19 40 L8 47.5 Z" fill="rgba(255,255,255,.55)"/>
      <path d="M19 38 V56 L17.3 56 V39 Z" fill="rgba(0,0,0,.4)"/>
      <path d="M22 56 V34 L33 24 V56 Z" fill="url(#b2D)" opacity=".95"/>
      <path d="M22 34 L33 24 L33 26 L22 35.5 Z" fill="rgba(255,255,255,.55)"/>
      <path d="M33 24 V56 L31.3 56 V25 Z" fill="rgba(0,0,0,.4)"/>
      <path d="M36 56 V20 L47 8 V56 Z" fill="url(#b3D)"/>
      <path d="M36 20 L47 8 L47 10 L36 21.5 Z" fill="rgba(255,255,255,.6)"/>
      <path d="M47 8 V56 L45.3 56 V9 Z" fill="rgba(0,0,0,.4)"/>
    </g>
    <text x="13.5" y="55" text-anchor="middle" font-family="Bowlby One, Inter, sans-serif" font-weight="900" font-size="14" fill="#001a0e" style="letter-spacing:-0.5px">C</text>
    <text x="27.5" y="55" text-anchor="middle" font-family="Bowlby One, Inter, sans-serif" font-weight="900" font-size="20" fill="#001a0e" style="letter-spacing:-0.5px">F</text>
    <text x="41.5" y="55" text-anchor="middle" font-family="Bowlby One, Inter, sans-serif" font-weight="900" font-size="22" fill="#001a0e" style="letter-spacing:-1px">M</text>
  </svg>
</div>

</body></html>
