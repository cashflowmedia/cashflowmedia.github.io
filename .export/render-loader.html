<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:#0c0e0d}
  body{display:flex;align-items:center;justify-content:center;width:1024px;height:1024px}
  .wrap{width:880px;height:880px;overflow:visible}
  /* For static export: bars stay at full height (skip cascadeLoad which collapses them) */
  .cas-load{transform-origin:bottom;transform-box:fill-box}
  .dollar-load{transform-origin:center;transform-box:fill-box;opacity:1;animation:dollarLoad 2.4s ease-in-out infinite}
  @keyframes dollarLoad{0%,100%{opacity:1;transform:scale(1);filter:drop-shadow(0 0 4px #F4C95C)}50%{opacity:1;transform:scale(1.08);filter:drop-shadow(0 0 10px #F4C95C)}}
  .fire-base{transform-origin:center;transform-box:fill-box;animation:fireFlick 3s ease-in-out infinite}
  @keyframes fireFlick{0%,100%{opacity:.5;transform:scaleX(1)}50%{opacity:.8;transform:scaleX(1.12)}}
  .ember{transform-box:fill-box;transform-origin:center;animation:emberRise 4.5s ease-out infinite;filter:drop-shadow(0 0 1.5px #F4C95C)}
  @keyframes emberRise{0%{transform:translate(0,0) scale(1);opacity:0}15%{opacity:1}50%{transform:translate(2px,-30px) scale(.7);opacity:.75}100%{transform:translate(-2px,-58px) scale(.2);opacity:0}}
  .big-spark{transform-box:fill-box;transform-origin:center;animation:bigSpark 7s ease-out infinite;filter:drop-shadow(0 0 4px #FFE080)}
  @keyframes bigSpark{0%,80%{transform:translate(0,0) scale(1);opacity:0}82%{transform:translate(0,-5px) scale(1.4);opacity:1}95%{transform:translate(2px,-40px) scale(.6);opacity:.6}100%{transform:translate(-2px,-55px) scale(.2);opacity:0}}
</style></head><body>
<div class="wrap">
<svg viewBox="0 0 64 64" width="100%" height="100%" overflow="visible">
  <defs>
    <linearGradient id="b1" x1="0" y1="60" x2="0" y2="36" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#006622"/><stop offset="1" stop-color="#1aff66"/></linearGradient>
    <linearGradient id="b2" x1="0" y1="60" x2="0" y2="22" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#008833"/><stop offset=".6" stop-color="#1aff66"/><stop offset="1" stop-color="#aaff99"/></linearGradient>
    <linearGradient id="b3" x1="0" y1="60" x2="0" y2="6"  gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#008833"/><stop offset=".45" stop-color="#1aff66"/><stop offset=".78" stop-color="#aaff99"/><stop offset="1" stop-color="#F4C95C"/></linearGradient>
    <radialGradient id="fireGrad" cx="50%" cy="100%" r="60%">
      <stop offset="0" stop-color="#F4C95C" stop-opacity=".75"/>
      <stop offset=".5" stop-color="#D49A30" stop-opacity=".35"/>
      <stop offset="1" stop-color="#604016" stop-opacity="0"/>
    </radialGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <ellipse cx="32" cy="59" rx="22" ry="2" fill="rgba(0,0,0,0.6)" filter="url(#g)"/>
  <!-- Layered flames behind logo -->
  <ellipse class="fire-base" cx="32" cy="60" rx="34" ry="9" fill="url(#fireGrad)" opacity="0.55" style="animation-duration:3.6s"/>
  <ellipse class="fire-base" cx="32" cy="60" rx="28" ry="7" fill="url(#fireGrad)" style="animation-duration:2.8s;animation-delay:-.4s"/>
  <ellipse class="fire-base" cx="20" cy="58" rx="10" ry="4.5" fill="url(#fireGrad)" opacity="0.7" style="animation-duration:2.1s;animation-delay:-1.1s"/>
  <ellipse class="fire-base" cx="44" cy="58" rx="11" ry="5" fill="url(#fireGrad)" opacity="0.7" style="animation-duration:2.4s;animation-delay:-.6s"/>
  <ellipse class="fire-base" cx="32" cy="55" rx="6" ry="3.5" fill="#FFD480" opacity="0.4" style="animation-duration:1.8s;animation-delay:-1.4s;mix-blend-mode:screen"/>
  <ellipse class="fire-base" cx="14" cy="57" rx="4" ry="2.5" fill="#F4C95C" opacity="0.55" style="animation-duration:1.6s;animation-delay:-.9s"/>
  <ellipse class="fire-base" cx="50" cy="57" rx="4" ry="2.5" fill="#F4C95C" opacity="0.55" style="animation-duration:2s;animation-delay:-1.7s"/>
  <!-- Lots of embers rising -->
  <circle class="ember" cx="8"  cy="58" r="0.6" fill="#FFD480" style="animation-delay:-.4s;animation-duration:5.2s"/>
  <circle class="ember" cx="14" cy="56" r="0.8" fill="#F4C95C" style="animation-delay:-1.2s;animation-duration:5.5s"/>
  <circle class="ember" cx="20" cy="58" r="0.5" fill="#FFE4A0" style="animation-delay:-2.8s;animation-duration:4.6s"/>
  <circle class="ember" cx="26" cy="57" r="0.7" fill="#F4C95C" style="animation-delay:-3.6s;animation-duration:5.8s"/>
  <circle class="ember" cx="30" cy="58" r="0.5" fill="#FFD480" style="animation-delay:-1.7s;animation-duration:4.9s"/>
  <circle class="ember" cx="34" cy="56" r="0.6" fill="#FFD480" style="animation-delay:-3.4s;animation-duration:6.2s"/>
  <circle class="ember" cx="38" cy="58" r="0.7" fill="#F4C95C" style="animation-delay:-.8s;animation-duration:5.1s"/>
  <circle class="ember" cx="42" cy="57" r="0.5" fill="#FFE4A0" style="animation-delay:-2.3s;animation-duration:5.7s"/>
  <circle class="ember" cx="46" cy="58" r="0.6" fill="#F4C95C" style="animation-delay:-4s;animation-duration:4.4s"/>
  <circle class="ember" cx="49" cy="56" r="0.7" fill="#F4C95C" style="animation-delay:-2.1s;animation-duration:4.8s"/>
  <circle class="ember" cx="54" cy="58" r="0.5" fill="#FFD480" style="animation-delay:-1s;animation-duration:5.4s"/>
  <circle class="ember" cx="58" cy="57" r="0.6" fill="#F4C95C" style="animation-delay:-3s;animation-duration:6s"/>
  <!-- Big occasional sparks -->
  <circle class="big-spark" cx="22" cy="58" r="1" fill="#FFE4A0" style="animation-delay:-2.5s;animation-duration:7.2s"/>
  <circle class="big-spark" cx="42" cy="58" r="1" fill="#FFE4A0" style="animation-delay:-5.6s;animation-duration:7.8s"/>
  <g filter="url(#g)">
    <path class="cas-load cas-1" d="M8 56 V46 L19 38 V56 Z" fill="url(#b1)" opacity=".85"/>
    <path class="cas-load cas-1" d="M8 56 V46 L9.5 46.7 V56 Z" fill="rgba(255,255,255,.45)"/>
    <path class="cas-load cas-1" d="M8 46 L19 38 L19 40 L8 47.5 Z" fill="rgba(255,255,255,.55)"/>
    <path class="cas-load cas-1" d="M19 38 V56 L17.3 56 V39 Z" fill="rgba(0,0,0,.4)"/>
    <path class="cas-load cas-2" d="M22 56 V34 L33 24 V56 Z" fill="url(#b2)" opacity=".95"/>
    <path class="cas-load cas-2" d="M22 56 V34 L23.5 34.7 V56 Z" fill="rgba(255,255,255,.45)"/>
    <path class="cas-load cas-2" d="M22 34 L33 24 L33 26 L22 35.5 Z" fill="rgba(255,255,255,.55)"/>
    <path class="cas-load cas-2" d="M33 24 V56 L31.3 56 V25 Z" fill="rgba(0,0,0,.4)"/>
    <path class="cas-load cas-3" d="M36 56 V20 L47 8 V56 Z" fill="url(#b3)"/>
    <path class="cas-load cas-3" d="M36 56 V20 L37.5 20.7 V56 Z" fill="rgba(255,255,255,.5)"/>
    <path class="cas-load cas-3" d="M36 20 L47 8 L47 10 L36 21.5 Z" fill="rgba(255,255,255,.6)"/>
    <path class="cas-load cas-3" d="M47 8 V56 L45.3 56 V9 Z" fill="rgba(0,0,0,.4)"/>
  </g>
  <text class="dollar-load" x="41.5" y="44" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="900" fill="#001a0e" style="letter-spacing:-1px">$</text>
</svg>
</div></body></html>
