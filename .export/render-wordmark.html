<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#0c0e0d}
  body{display:flex;align-items:center;justify-content:center;width:1600px;height:600px;gap:32px}
  .icon-wrap{width:300px;height:300px;flex-shrink:0}
  .word{display:inline-flex;align-items:baseline}
  .cf{font-family:'Bricolage Grotesque','Space Grotesk',sans-serif;font-weight:800;font-size:140px;letter-spacing:-.015em;background:linear-gradient(120deg,#F4C95C 0%,#FFE4A0 30%,#F4C95C 60%,#FFD480 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;background-size:250% 100%;filter:drop-shadow(0 0 18px rgba(244,201,92,.7)) drop-shadow(0 0 40px rgba(244,201,92,.4)) drop-shadow(0 1px 4px rgba(0,0,0,.5))}
  .em{display:inline-block;margin-left:24px;font-family:'Share Tech Mono','JetBrains Mono',monospace;font-size:160px;line-height:1;letter-spacing:.06em;color:#1aff66;text-shadow:0 0 4px rgba(26,255,102,.85),0 0 14px rgba(26,255,102,.4);filter:drop-shadow(0 0 18px rgba(26,255,102,.5)) drop-shadow(0 0 40px rgba(26,255,102,.25))}
  /* logo svg styles */
  .cas{transform-origin:bottom;transform-box:fill-box;animation:cas 3.2s ease-in-out infinite}
  .cas-1{animation-delay:0s}.cas-2{animation-delay:.22s}.cas-3{animation-delay:.44s}
  @keyframes cas{0%,100%{transform:scaleY(.92)}35%,55%{transform:scaleY(1.05)}}
  .ember{transform-box:fill-box;transform-origin:center;animation:em 4.5s ease-out infinite;filter:drop-shadow(0 0 1.5px #F4C95C)}
  @keyframes em{0%{transform:translate(0,0) scale(1);opacity:0}15%{opacity:1}50%{transform:translate(2px,-30px) scale(.7);opacity:.75}100%{transform:translate(-2px,-58px) scale(.2);opacity:0}}
</style></head><body>
<div class="icon-wrap">
<svg viewBox="0 0 64 64" width="100%" height="100%" overflow="visible">
  <defs>
    <linearGradient id="b1" x1="0" y1="60" x2="0" y2="36" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#006622"/><stop offset="1" stop-color="#1aff66"/></linearGradient>
    <linearGradient id="b2" x1="0" y1="60" x2="0" y2="22" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#008833"/><stop offset=".6" stop-color="#1aff66"/><stop offset="1" stop-color="#aaff99"/></linearGradient>
    <linearGradient id="b3" x1="0" y1="60" x2="0" y2="6"  gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#008833"/><stop offset=".45" stop-color="#1aff66"/><stop offset=".78" stop-color="#aaff99"/><stop offset="1" stop-color="#F4C95C"/></linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <circle class="ember" cx="8"  cy="58" r="0.7" fill="#F4C95C" style="animation-delay:-.5s;animation-duration:5.2s"/>
  <circle class="ember" cx="22" cy="58" r="0.6" fill="#FFE4A0" style="animation-delay:-1.4s;animation-duration:4.8s"/>
  <circle class="ember" cx="38" cy="58" r="0.5" fill="#FFD480" style="animation-delay:-.9s;animation-duration:5s"/>
  <circle class="ember" cx="54" cy="58" r="0.6" fill="#FFE4A0" style="animation-delay:-4.1s;animation-duration:4.6s"/>
  <g filter="url(#g)">
    <path class="cas cas-1" d="M8 56 V46 L19 38 V56 Z" fill="url(#b1)" opacity=".85"/>
    <path d="M8 56 V46 L9.5 46.7 V56 Z" fill="rgba(255,255,255,.45)"/>
    <path d="M8 46 L19 38 L19 40 L8 47.5 Z" fill="rgba(255,255,255,.55)"/>
    <path d="M19 38 V56 L17.3 56 V39 Z" fill="rgba(0,0,0,.4)"/>
    <path class="cas cas-2" d="M22 56 V34 L33 24 V56 Z" fill="url(#b2)" opacity=".95"/>
    <path d="M22 56 V34 L23.5 34.7 V56 Z" fill="rgba(255,255,255,.45)"/>
    <path d="M22 34 L33 24 L33 26 L22 35.5 Z" fill="rgba(255,255,255,.55)"/>
    <path d="M33 24 V56 L31.3 56 V25 Z" fill="rgba(0,0,0,.4)"/>
    <path class="cas cas-3" d="M36 56 V20 L47 8 V56 Z" fill="url(#b3)"/>
    <path d="M36 56 V20 L37.5 20.7 V56 Z" fill="rgba(255,255,255,.5)"/>
    <path d="M36 20 L47 8 L47 10 L36 21.5 Z" fill="rgba(255,255,255,.6)"/>
    <path d="M47 8 V56 L45.3 56 V9 Z" fill="rgba(0,0,0,.4)"/>
  </g>
  <text x="41.5" y="44" text-anchor="middle" font-family="Bowlby One, Inter, sans-serif" font-size="22" font-weight="400" fill="#001a0e">$</text>
</svg>
</div>
<span class="word"><span class="cf">CashFlow</span><span class="em">media</span></span>
</body></html>
